<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#122c2b"/><meta name="description" content="PDF Pro. Your private, local-first PDF workbench."/><link rel="icon" href="./icons/mark.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/><title>PDF Pro — Documents. Done right.</title>
<style>#boot{font:16px/1.45 -apple-system,system-ui,sans-serif;color:#122c2b;padding:40px 20px;max-width:520px;margin:0 auto}#boot h1{font-size:20px;margin:0 0 8px}#boot pre{white-space:pre-wrap;word-break:break-word;background:#f1f3ef;padding:10px;border-radius:8px;font-size:13px}#boot button{font:inherit;min-height:44px;padding:8px 16px;margin:8px 8px 0 0;border-radius:10px;border:1px solid #c9cfc6;background:#fff;color:#122c2b}#boot button.main{background:#122c2b;color:#fff;border-color:#122c2b}</style>
<script>
(function(){
  var shown=false;
  function root(){return document.getElementById('root');}
  function booting(){var r=root();return !r||r.querySelector('#boot')||!r.children.length;}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  window.pdfproReset=function(){
    var jobs=[];
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));}catch(e){}
    try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));}catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){location.replace(location.pathname+'?fresh='+Date.now());});
  };
  window.pdfproShowBootError=function(title,detail){
    if(shown||!booting())return;shown=true;
    var r=root();if(!r)return;
    r.innerHTML='<div id="boot"><h1>'+esc(title)+'</h1><p>Your saved PDFs are not affected. Try <b>Reload</b> first. If it still fails, tap <b>Clear app cache and reload</b>.</p><button class="main" onclick="location.reload()">Reload</button><button onclick="pdfproReset()">Clear app cache and reload</button><p style="margin-top:18px">If it still won\'t open, screenshot this and send it to whoever is helping you:</p><pre>'+esc(detail)+'\n\n'+esc(navigator.userAgent)+'</pre></div>';
  };
  addEventListener('error',function(e){
    var t=e.target;
    if(t&&t!==window&&(t.tagName==='SCRIPT'||t.tagName==='LINK')){pdfproShowBootError('PDF Pro could not load a file','Missing: '+(t.src||t.href));return;}
    pdfproShowBootError('PDF Pro hit an error while starting',(e.message||'Unknown error')+(e.filename?'\n'+e.filename+':'+e.lineno:''));
  },true);
  addEventListener('unhandledrejection',function(e){var r=e.reason;pdfproShowBootError('PDF Pro hit an error while starting',(r&&(r.stack||r.message))||String(r));});
  setTimeout(function(){pdfproShowBootError('PDF Pro is taking too long to start','The app did not finish starting after 20 seconds. A slow connection or an old cached copy can cause this.');},20000);
})();
</script>
</head><body><div id="root"><div id="boot"><h1>Loading PDF Pro…</h1><p>First visit can take a few seconds.</p></div></div><script type="module" src="/src/main.tsx"></script></body></html>
